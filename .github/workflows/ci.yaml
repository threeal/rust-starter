name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Build
        run: cargo build

      - name: Test
        run: cargo tarpaulin

      - name: Check lint
        run: cargo clippy -- --deny warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Package
        run: cargo package
