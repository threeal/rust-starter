name: Release
on:
  push:
    tags: ["**"]
jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check version
        run: |
          VERSION=$(yq -p toml -oy '.package.version' Cargo.toml)
          echo "$VERSION"
          test "${GITHUB_REF_NAME#v}" = "$VERSION"

  build:
    name: Build
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install toolchain
        run: rustup install

      - name: Build
        run: cargo install --path . --root dist --locked

      - name: Archive binaries
        run: |
          NAME=$(yq -p toml -oy '.package.name' Cargo.toml)
          TARGET=$(rustc --print host-tuple)
          tar -czf "$NAME-$TARGET.tar.gz" -C dist/bin .

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries
          path: "*.tar.gz"

  draft:
    name: Draft
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: binaries

      - name: Create draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes *.tar.gz
