name: Check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: dprint

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.1.0

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Install toolchain
        run: rustup install

      - name: Test
        run: cargo tarpaulin

  document:
    name: Document
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install toolchain
        run: rustup install

      - name: Document
        run: cargo doc --no-deps

  package:
    name: Package
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install toolchain
        run: rustup install

      - name: Package
        run: cargo package
